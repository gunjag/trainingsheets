<p>Table of contents</p>
<nav>
  <ul>
    <li><a routerLink="./sheet1" routerLinkActive="active" ariaCurrentWhenActive="page">Sheet 1</a></li>
    <li><a routerLink="./sheet2" routerLinkActive="active" ariaCurrentWhenActive="page">Sheet 2</a></li>
  </ul>
</nav>

<div class="grid-container" style="line-height: normal">
  <div class="item1">Training Sheets</div>
  <div class="item2">
   <div class="grid grid-pad">
    <a *ngFor="let exerciseDay of exerciseDays" class="col-1-4" routerLink="/{{exerciseDay.date | date:'dd.mm.yyyy'}}">
      <div class="module exerciseDay" (click)="selectDate(exerciseDay)" clickable>
        <h4>{{exerciseDay.date | date:'dd.mm.yyyy' }}</h4>
      </div>
    </a>
   </div>
   <button type="newExerciseDayButton">New</button>
  </div>
  <div class="item3">
    <div class="grid grid-pad">
      <a *ngFor="let sheet of sheets" class="col-1-4" routerLink="/{{sheet.shortName}}">
        <div class="module sheet" (click)="selectSheet(sheet)" clickable>
          <h4>{{sheet.shortName}}</h4>
        </div>
      </a>
    </div>
    <button type="addSheetButton" (click)="clickedAddSheetButton()" clickable>Add</button>
    <button type="newSheetButton" (click)="clickedNewSheetButton()" clickable>New</button>
  </div>  
  <div class="item4">
    <sheetDetail></sheetDetail>
  </div>
  <div class="item5">Footer</div>
</div>

<p>Table of contents</p>
<nav>
  <ul>
    <li><a routerLink="./sheet1" routerLinkActive="active" ariaCurrentWhenActive="page">Sheet 1</a></li>
    <li><a routerLink="./sheet2" routerLinkActive="active" ariaCurrentWhenActive="page">Sheet 2</a></li>
  </ul>
</nav>
<div class="grid grid-pad">
  <a *ngFor="let exerciseDay of exerciseDays" class="col-1-4"
       routerLink="/detail/{{exerciseDay.date}}">
    <div class="module exerciseDay">
      <h4>{{exerciseDay.date | date:'dd.mm.yyyy' }}</h4>
    </div>
  </a>
</div>
<div class="grid-container">
  <div class="item1">Training Sheets</div>
  <div class="item2">
   <div class="grid grid-pad">
    <a *ngFor="let exerciseDay of exerciseDays" class="col-1-4"
        routerLink="/{{exerciseDay.date | date:'dd.mm.yyyy'}}">
      <div class="module exerciseDay">
        <h4>{{exerciseDay.date | date:'dd.mm.yyyy' }}</h4>
      </div>
    </a>
   </div>
  </div>
  <div class="item3">
    <div class="grid grid-pad">
      <a *ngFor="let sheet of sheets" class="col-1-4"
        routerLink="/{{sheet.shortName}}">
      <div class="module sheet">
        <h4>{{sheet.shortName}}</h4>
      </div>
    </a>
   </div>
  </div>  
  <div class="item4">Right</div>
  <div class="item5">Footer</div>
</div>
